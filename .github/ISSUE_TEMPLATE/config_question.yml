    id: question
    attributes:
      label: คำถาม
    validations:
      required: true

  - type: dropdown
    id: pack
    attributes:
      label: Starter pack ที่เกี่ยวข้อง
      options:
        - pilot-lab-example
        - custom / ยังไม่มี pack
        - N/A

  - type: markdown
    attributes:
      value: |
        คำถาม Q1–Q21 จาก discovery ส่วนใหญ่กลายเป็น **config ในระบบ** แล้ว — ดู `docs/discovery/clarification-requests.md`
