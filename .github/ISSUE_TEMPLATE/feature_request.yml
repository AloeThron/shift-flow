name: Feature Request
description: ขอฟีเจอร์หรือปรับปรุงที่ไม่ใช่ bug
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        อธิบายปัญหาหน้างานและทำไม config ปัจจุบันแก้ไม่ได้ — หลีกเลี่ยงการขอ hardcode ค่าเฉพาะแล็บ

  - type: textarea
    id: problem
    attributes:
      label: ปัญหา / use case
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: ข้อเสนอ (solution)
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: ขอบเขต
      options:
        - engine capability (generic — ทุก org ได้ประโยชน์)
        - site policy / admin UI (org ตั้งค่าเอง)
        - docs / starter pack
        - integration / export

  - type: checkboxes
    id: alternatives
    attributes:
      label: ทางเลือกที่พิจารณาแล้ว
      options:
        - label: ใช้ rule template ที่มีอยู่แล้ว + ปรับ params
          required: false
        - label: แก้เฉพาะ starter pack ไม่ต้องแก้โค้ด
          required: false
