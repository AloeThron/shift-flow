name: Bug Report
description: รายงานพฤติกรรมที่ผิดจากที่คาดไว้
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ขอบคุณที่รายงาน — กรุณาไม่แนบข้อมูลบุคลากรจริงหรือ screenshot ที่มี PII

  - type: textarea
    id: description
    attributes:
      label: คำอธิบาย
      description: เกิดอะไรขึ้น vs คาดหวังอะไร
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: ขั้นตอนทำซ้ำ
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit / เวอร์ชัน
      placeholder: git sha หรือ tag

  - type: dropdown
    id: area
    attributes:
      label: พื้นที่ที่เกี่ยวข้อง
      options:
        - validator / constraints
        - solver / scheduling
        - import wizard
        - admin config UI
        - auth / tenant
        - docs / starter pack
        - other

  - type: checkboxes
    id: safety
    attributes:
      label: Safety impact
      options:
        - label: อาจทำให้ hard safety constraint ถูก bypass
          required: false
