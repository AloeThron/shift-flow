version: 2
updates:
  # GitHub Actions — รวมอัปเดต workflow เป็น PR เดียวต่อสัปดาห์ (ไม่รวม major)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - ci

  # npm/pnpm — รวมอัปเดตทุกแพ็กเกจเป็น PR เดียวต่อสัปดาห์ (ไม่รวม major)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
